# Dependency updates. The manifests use floor-only (`>=`) pins with no lockfile,
# so an upstream release reaches the build the moment it is published -- these
# PRs are the mechanism that surfaces that as a reviewable change with CI run
# against it, rather than as a surprise on the next deploy.
#
# Everything is grouped into ONE PR per ecosystem per interval. Ungrouped, this
# opens a PR per package and drowns a solo-maintainer repo; grouped, it is a
# single "here is this month's dependency drift" review.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # Pinned action versions go stale silently and are a supply-chain surface.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "docker"
