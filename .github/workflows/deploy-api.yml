name: Deploy API to Fly.io

# Manual trigger only, deliberately. Deploying is an outward-facing action, so it
# is not wired to `push`. Once you trust the pipeline, add:
#   on:
#     push:
#       branches: [main]
# Requires a FLY_API_TOKEN repository secret (`flyctl tokens create deploy`).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # The Dockerfile copies the committed 360K core and fails the build if
          # these are LFS pointer stubs.
          lfs: true

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
