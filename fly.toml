# fly.toml app configuration file generated for sonic-recommender-api on 2026-08-28T21:28:32-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sonic-recommender-api'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  EASE_B_BYTES = '538889924'
  EASE_B_CACHE_DIR = '/artifacts'
  EASE_B_SHA256 = '2ab7e37dab346cd88b7c36a3b218756f9382de1bc28bbf138ea0eeb431709b37'
  EASE_B_URL = 'https://huggingface.co/jone1751/sonic-ease-360k/resolve/main/ease_B.npy'
  PORT = '8000'

[[mounts]]
  source = 'sonic_artifacts'
  destination = '/artifacts'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '3m0s'
    path = '/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
