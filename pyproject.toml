[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "music-recommender"
version = "1.0.0"
description = "Collaborative-filtering music recommender (Last.fm) with a disciplined, autoresearch-style hyperparameter search and a FastAPI service."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris" }]
dependencies = [
    "pandas>=3.1.0",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "pyarrow>=26.0.0",
    "implicit>=0.7.3",
    "threadpoolctl>=3.7.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.4",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "httpx>=0.28.1",
    "ruff>=0.17.3",
    "jupyterlab>=4.6.5",
    "ipywidgets>=8.1.9",
]
# The Streamlit front-end app (app/), the interactive portfolio demo.
app = [
    "streamlit>=1.66.1",
    "plotly>=7.1.0",
]
# The deep-learning experiment (Mult-VAE, notebook 07), heavy, kept optional.
experiments = ["torch>=2.15.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks", "data", "outputs", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E402 (import not at top) is intentional: CLI entrypoints and the API pin BLAS
# env vars before importing numpy/implicit.
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the real 360K core + EASE artifact on disk (deselect with -m 'not integration')",
]
pythonpath = ["."]   # make `src` and `api` importable without setting PYTHONPATH
filterwarnings = [
    "ignore:.*OpenBLAS is configured.*:RuntimeWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*expects CSR input.*",
]
